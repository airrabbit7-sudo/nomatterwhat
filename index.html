<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mennyire szeretlek? 💗</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --pink: #d98da6;
    --dark-pink: #a95d7a;
    --cream: #fff8f5;
    --text: #614653;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, "Times New Roman", serif;
    color: var(--text);
    background:
        radial-gradient(ellipse at top left, #ffe5eb 0%, transparent 50%),
        linear-gradient(145deg, #fff9f4, #fbe6ec 55%, #f2dce7);
    overflow-x: hidden;
}

body::before {
    content: "♡";
    position: fixed;
    top: 4%;
    left: 5%;
    font-size: 100px;
    color: #d98da6;
    opacity: .12;
    pointer-events: none;
    z-index: -1;
}

header {
    text-align: center;
    padding: 45px 20px 15px;
    transition: opacity 12s ease, transform 12s ease;
}

.eyebrow {
    letter-spacing: 4px;
    text-transform: uppercase;
    font-size: 11px;
    color: #b47b91;
}

h1 {
    font-size: clamp(32px, 7vw, 52px);
    font-weight: normal;
    margin: 15px 0;
}

.subtitle {
    font-size: 16px;
    line-height: 1.8;
    color: #967481;
}

main {
    width: min(92%, 560px);
    margin: 20px auto 70px;
    transition: opacity 12s ease, transform 12s ease;
}

.panel {
    background: rgba(255,255,255,.68);
    border: 1px solid rgba(255,255,255,.85);
    border-radius: 25px;
    padding: 28px;
    box-shadow: 0 15px 45px rgba(133,78,101,.10);
    backdrop-filter: blur(8px);
}

.field {
    margin-bottom: 25px;
}

.field-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
}

label {
    font-size: 16px;
}

.value {
    color: var(--dark-pink);
    font-size: 15px;
    font-weight: bold;
    white-space: nowrap;
}

input[type="range"] {
    appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 10px;
    background: #f0cbd8;
    outline: none;
    cursor: pointer;
}

input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    width: 21px;
    height: 21px;
    border-radius: 50%;
    background: var(--dark-pink);
    border: 3px solid white;
    box-shadow: 0 2px 7px #c28ba0;
}

input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--dark-pink);
    border: 3px solid white;
}

.select-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 28px;
}

.select-field label {
    display: block;
    margin-bottom: 9px;
}

select {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid #edcbd8;
    color: var(--text);
    background: #fff9fb;
    font-family: inherit;
    font-size: 14px;
}

.main-button, .again-button {
    width: 100%;
    padding: 16px 20px;
    margin-top: 28px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(120deg, #d98da6, #b96e8c);
    color: white;
    font-family: inherit;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 7px 20px #d9a3b8;
    transition: transform .2s, box-shadow .2s, opacity .2s;
}

.main-button:hover:not(:disabled),
.again-button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px #d5a0b5;
}

button:disabled {
    opacity: .4;
    cursor: not-allowed;
    box-shadow: none;
}

.result {
    display: none;
    margin-top: 24px;
    text-align: center;
    animation: appear .7s ease;
}

.result h2 {
    font-size: 25px;
    font-weight: normal;
}

.result p {
    line-height: 1.8;
    color: #967481;
}

.result .again-button {
    margin-top: 12px;
}

.attempt {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #b47b91;
}

/* A vers képernyője: a sötét háttér lassan úszik be */
#poemScreen {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 40px 20px;
    background:
        radial-gradient(ellipse at 50% 0%, #64435c 0%, transparent 55%),
        linear-gradient(145deg, #302432, #4a3044, #292433);
    color: #fff0f4;
    text-align: center;
    opacity: 0;
    transition: opacity 12s ease;
}

#poemScreen.visible {
    opacity: 1;
}

.fade-out {
    opacity: 0;
    transform: translateY(-8px);
    transition: opacity 12s ease, transform 12s ease;
}

.poem-inner {
    width: min(100%, 620px);
    margin: 0 auto;
    padding: 35px 0 60px;
}

.poem-heart {
    font-size: 32px;
    margin-bottom: 18px;
    color: #edb1c5;
    animation: heartGlow 3s ease-in-out infinite;
}

#poemScreen h2 {
    font-weight: normal;
    font-size: clamp(30px, 6vw, 43px);
    margin-bottom: 35px;
    color: #f6d4e0;
}

#poemText {
    white-space: pre-line;
    font-size: 17px;
    line-height: 2;
    color: #f8dfe8;
}

.poem-line {
    opacity: 0;
    transform: translateY(12px);
    animation: poemAppear 2.2s ease forwards;
}

.poem-footer {
    margin-top: 40px;
    font-style: italic;
    color: #d9a8ba;
    opacity: 0;
    animation: poemAppear 2.5s ease forwards;
    animation-delay: 8s;
}


.heart {
    position: fixed;
    bottom: -30px;
    pointer-events: none;
    z-index: -1;
    animation: floatUp linear forwards;
}

@keyframes floatUp {
    0% { transform: translateY(0) rotate(0); opacity: 0; }
    15% { opacity: .55; }
    100% { transform: translateY(-110vh) rotate(35deg); opacity: 0; }
}

@keyframes appear {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes poemAppear {
    to { opacity: 1; transform: translateY(0); }
}

@keyframes heartGlow {
    0%, 100% { transform: scale(1); opacity: .75; }
    50% { transform: scale(1.12); opacity: 1; }
}

@media (max-width: 430px) {
    .panel { padding: 22px 18px; }
    .select-grid { grid-template-columns: 1fr; }
    header { padding-top: 30px; }
    #poemScreen { padding: 25px 22px; }
}
/* Kompaktabb elrendezés, hogy kevesebbet kelljen görgetni */
header {
    padding: 20px 16px 5px;
}

h1 {
    font-size: clamp(28px, 5vw, 40px);
    margin: 8px 0;
}

.eyebrow {
    font-size: 10px;
    letter-spacing: 3px;
}

.subtitle {
    font-size: 14px;
    line-height: 1.5;
    margin: 8px 0;
}

main {
    width: min(92%, 500px);
    margin: 10px auto 25px;
}

.panel {
    padding: 20px 24px;
    border-radius: 20px;
}

.field {
    margin-bottom: 16px;
}

.field-top {
    margin-bottom: 7px;
}

label {
    font-size: 14px;
}

.value {
    font-size: 13px;
}

.select-grid {
    gap: 10px 12px;
    margin-top: 18px;
}

.select-field label {
    margin-bottom: 6px;
}

select {
    padding: 9px 10px;
    font-size: 13px;
}

.main-button,
.again-button {
    padding: 12px 16px;
    margin-top: 18px;
    font-size: 14px;
}

.result {
    margin-top: 16px;
}

.result h2 {
    font-size: 22px;
    margin: 10px 0;
}

.result p {
    font-size: 14px;
    line-height: 1.6;
}

/* Kisebb képernyőkön még tömörebb */
@media (max-width: 600px) {
    header {
        padding-top: 16px;
    }

    main {
        margin-top: 6px;
        margin-bottom: 16px;
    }

    .panel {
        padding: 17px 16px;
    }

    .field {
        margin-bottom: 13px;
    }

    .select-grid {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 14px;
    }

    select {
        padding: 9px 7px;
        font-size: 12px;
    }

    .subtitle {
        font-size: 13px;
    }
}

/* Görgetés nélküli, képernyőhöz igazított elrendezés */
html {
    height: 100%;
    overflow: hidden;
}

body {
    height: 100vh;
    height: 100dvh;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

header {
    flex: 0 0 auto;
    padding: 12px 12px 4px;
}

.eyebrow {
    font-size: 9px;
    letter-spacing: 2px;
}

h1 {
    font-size: clamp(25px, 4.5vh, 36px);
    margin: 5px 0;
}

.subtitle {
    font-size: 12px;
    line-height: 1.3;
    margin: 4px 0;
}

main {
    flex: 1 1 auto;
    min-height: 0;
    width: min(92%, 470px);
    margin: 4px auto 12px;
    display: flex;
}

.panel {
    width: 100%;
    min-height: 0;
    padding: 14px 20px;
    border-radius: 18px;
    overflow: hidden;
    display: flex;

}

.field {

}

}

label {

}

.value {

}

}

}

}

.select-grid {
    grid-template-columns: 1fr 1fr;

}

.select-field label {

select {

}

.main-button,
.again-button {
    flex-shrink: 0;
    padding: 10px 12px;
    margin-top: 10px;

}

.result {
    margin-top: 8px;
    overflow-y: auto;
    min-height: 0;
}

.result h2 {
    font-size: 19px;

}

.result p {
    font-size: 12px;
    line-height: 1.45;
    margin: 6px 0;
}

/* Alacsonyabb képernyők */
@media (max-height: 650px) {
    header {
        padding-top: 5px;
        padding-bottom: 0;
    }

    h1 {
        font-size: 25px;
        margin: 3px 0;
    }

    main {
        margin-top: 2px;
        margin-bottom: 5px;
    }

    .panel {
        padding: 8px 16px;
    }

    .field {
        margin-bottom: 4px;
    }

    .select-grid {
        gap: 5px 8px;
        margin-top: 5px;
    }

    select {
        padding: 5px 6px;
    }

    .main-button,
    .again-button {
        padding: 8px 10px;
        margin-top: 6px;
    }
}

/* Nagyon keskeny telefonok */
@media (max-width: 360px) {
    .panel {
        padding: 8px 12px;
    }

    label {
        font-size: 12px;
    }

    select {
        font-size: 11px;
        padding: 6px 4px;
    }
}

</style>
</head>

<body>

<header id="pageHeader">
    <div class="eyebrow">egy kis játék, neked ♡</div>
    <h1>Mennyire szeretlek?</h1>
</header>

<main id="game">
    <section class="panel">

        <div class="field">
            <div class="field-top">
                <label for="height">Magasság</label>
                <span class="value" id="heightValue">168 cm</span>
            </div>
            <input type="range" id="height" min="140" max="205" value="168">
        </div>

        <div class="field">
            <div class="field-top">
                <label for="weight">Testsúly</label>
                <span class="value" id="weightValue">50 kg</span>
            </div>
            <input type="range" id="weight" min="40" max="120" value="50">
        </div>

        <div class="field">
            <div class="field-top">
                <label for="hair">Hajhossz</label>
            </div>
            <input type="range" id="hair" min="1" max="5" value="3">
            <div class="field-top" style="margin-top:8px; margin-bottom:0">
                <span class="subtitle">Rövid</span>
                <span class="value" id="hairValue">Közepes</span>
                <span class="subtitle">Hosszú</span>
            </div>
        </div>

        <div class="select-grid">
            <div class="select-field">
                <label for="hairColor">Hajszín</label>
                <select id="hairColor">
                    <option>Fekete</option>
                    <option selected>Barna</option>
                    <option>Szőke</option>
                    <option>Vörös</option>
                    <option>Festett</option>
                </select>
            </div>

            <div class="select-field">
                <label for="eyes">Szemszín</label>
                <select id="eyes">
                    <option selected>Barna</option>
                    <option>Kék</option>
                    <option>Zöld</option>
                    <option>Szürke</option>
                    <option>Mogyoróbarna</option>
                </select>
            </div>

            <div class="select-field">
                <label for="body">Testalkat</label>
                <select id="body">
                    <option selected>Vékony</option>
                    <option>Sportos</option>
                    <option>Átlagos</option>
                    <option>Izmos</option>
                    <option>Puha ölelni való</option>
                </select>
            </div>

            <div class="select-field">
                <label for="style">Stílus</label>
                <select id="style">
                    <option>Elegáns</option>
                    <option selected>Laza</option>
                    <option>Sportos</option>
                    <option>Alternatív</option>
                    <option>Mindegy, csak te legyél</option>
                </select>
            </div>
        </div>

        <button class="main-button" id="loveButton">
            Mennyire szeretlek? ♡
        </button>

        <div class="result" id="result" aria-live="polite">
            <div class="attempt" id="attemptLabel"></div>
            <h2 id="resultTitle"></h2>
            <p id="resultMessage"></p>
            <button class="again-button" id="againButton" disabled>Újra ♡</button>
        </div>

    </section>
</main>

<section id="poemScreen">
    <div class="poem-inner">
        <div class="poem-heart">♡</div>
        <h2>Csak te legyél, mindig.</h2>

        <div id="poemText"></div>

        <div class="poem-footer">
            Bármi is változik, én szeretni foglak. ♡
        </div>
    </div>
</section>

<audio id="clickSound" src="click.mp3" preload="auto"></audio>
<audio id="bigButtonSound" src="big-button.mp3" preload="auto"></audio>
<audio id="loveMusic" src="love-song.mp3" preload="auto"></audio>

<script>
const $ = id => document.getElementById(id);

const controls = [
    $("height"), $("weight"), $("hair"),
    $("hairColor"), $("eyes"), $("body"), $("style")
];

const hairLengths = {
    1: "Nagyon rövid",
    2: "Rövid",
    3: "Közepes",
    4: "Hosszú",
    5: "Nagyon hosszú"
};

let attempts = 0;
let lastSettings = null;
let finished = false;
let soundCooldown = false;

const clickSound = new Audio("./click.mp3");
const bigButtonSound = new Audio("./big-button.mp3");
const music = new Audio("./love-song.mp3");

clickSound.preload = "auto";
bigButtonSound.preload = "auto";
music.preload = "auto";

const messages = [
    {
        title: "Tyhűű, 100%! ♡",
        message: "Próbáld újra..."
    },
    {
        title: "Tyhűű, még mindig...? 💗",
        message: "Na jó, adok még egy esélyt."
    }
];

const poem = `Te jelented a szépet...

Amíg a nap kergeti a holdat az égen,
amíg a faágak hajlanak a szélben,

Bárhogyan is nézel, bármilyen a hajad,
Számomra gyönyörű és az is marad.

Bármi történjen,
Amíg csillag ragyog az égen,
Én ugyanúgy szeretlek téged,
Mert számomra te jelented a szépet!
`;

function updateLabels() {
    $("heightValue").textContent = $("height").value + " cm";
    $("weightValue").textContent = $("weight").value + " kg";
    $("hairValue").textContent = hairLengths[$("hair").value];
}

function getSettings() {
    return JSON.stringify(controls.map(control => control.value));
}

function playClick() {
    clickSound.currentTime = 0;
    clickSound.volume = 0.4;

    clickSound.play().catch(error => {
        console.error("Kattintási hang hiba:", error);
    });
}
function playBigButtonSound() {
    try {
        bigButtonSound.currentTime = 0;
        bigButtonSound.volume = 0.8;
        bigButtonSound.play().catch(() => {});
    } catch (error) {}
}

function playControlSound() {
    if (soundCooldown) return;
    soundCooldown = true;
    playClick();

    setTimeout(() => {
        soundCooldown = false;
    }, 150);
}

function checkChanges() {
    if (finished || lastSettings === null) return;
    $("againButton").disabled = getSettings() === lastSettings;
}

$("height").addEventListener("input", () => {
    updateLabels();
    checkChanges();
    playControlSound();
});

$("weight").addEventListener("input", () => {
    updateLabels();
    checkChanges();
    playControlSound();
});

$("hair").addEventListener("input", () => {
    updateLabels();
    checkChanges();
    playControlSound();
});

["hairColor", "eyes", "body", "style"].forEach(id => {
    $(id).addEventListener("change", () => {
        checkChanges();
        playClick();
    });
});

function showResult() {
    $("result").style.display = "block";
    $("attemptLabel").textContent = "";
    $("loveButton").style.display = "none";

    if (attempts <= 2) {
        $("resultTitle").textContent = messages[attempts - 1].title;
        $("resultMessage").textContent = messages[attempts - 1].message;
        $("againButton").textContent = "Újra ♡";
        $("againButton").disabled = true;
        lastSettings = getSettings();
    } else {
        finished = true;
        $("resultTitle").textContent = "Na látod... ♡";
        $("resultMessage").textContent =
            "Bárhogy is nézel ki, én ugyanúgy szeretlek. Sőt...";
        $("againButton").textContent = "Van még valami neked ♡";
        $("againButton").disabled = false;
    }
}

$("loveButton").addEventListener("click", () => {
    if (attempts !== 0 || finished) return;

    playBigButtonSound();
    attempts = 1;
    showResult();
});

$("againButton").addEventListener("click", () => {
    if ($("againButton").disabled) return;

    playBigButtonSound();

    if (attempts < 3) {
        attempts++;
        showResult();
    } else {
        revealPoem();
    }
});

function revealPoem() {
    const screen = $("poemScreen");
    const poemText = $("poemText");

    poemText.replaceChildren();

    poem.split("\n").forEach((line, index) => {
        const lineElement = document.createElement("div");
        lineElement.className = "poem-line";
        lineElement.textContent = line || "\u00A0";
        lineElement.style.animationDelay = (index * 1.2) + "s";
        poemText.appendChild(lineElement);
    });

    // A két háttér 12 másodperc alatt, egyszerre vált át.
    screen.style.display = "block";

    // Külön képkockában rögzítjük a kezdő állapotot, hogy az áttűnés biztosan elinduljon.
    screen.classList.remove("visible");
    void screen.offsetWidth;

    requestAnimationFrame(() => {
        screen.classList.add("visible");
    });

    $("pageHeader").classList.add("fade-out");
    $("game").classList.add("fade-out");

    playLoveMusic();

    setTimeout(() => {
        $("pageHeader").style.display = "none";
        $("game").style.display = "none";
    }, 12000);
}


function playLoveMusic() {
    music.pause();
    music.currentTime = 0;
    music.volume = 0;

    const fadeInDuration = 7000;
    const totalDuration = 30000;
    const fadeOutDuration = 8000;
    const maxVolume = 0.38;
    const startedAt = Date.now();

    music.play().catch(() => {
        console.log("Ellenőrizd, hogy a love-song.mp3 feltöltődött-e.");
    });

    function fadeStep() {
        const elapsed = Date.now() - startedAt;

        if (elapsed < fadeInDuration) {
            music.volume = maxVolume * elapsed / fadeInDuration;
        } else if (elapsed < totalDuration - fadeOutDuration) {
            music.volume = maxVolume;
        } else if (elapsed < totalDuration) {
            music.volume =
                maxVolume * (totalDuration - elapsed) / fadeOutDuration;
        } else {
            music.volume = 0;
            music.pause();
            return;
        }

        requestAnimationFrame(fadeStep);
    }

    requestAnimationFrame(fadeStep);
}

function createHeart() {
    if (document.hidden || finished) return;

    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = Math.random() > 0.5 ? "♡" : "♥";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (15 + Math.random() * 18) + "px";
    heart.style.color = Math.random() > 0.5 ? "#d98da6" : "#e8b8c7";
    heart.style.animationDuration = (6 + Math.random() * 3) + "s";

    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 10000);
}

setInterval(createHeart, 1400);
updateLabels();
</script>

</body>
</html>
